name: walk_shelter

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shelter
      POSTGRES_PASSWORD: shelter
      POSTGRES_DB: walks
    ports:
      - "5433:5432"
    volumes:
      - walks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelter -d walks"]
      interval: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://shelter:shelter@db:5432/walks
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  walks_pgdata:
